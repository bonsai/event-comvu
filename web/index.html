<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>event-comvu — Semantic Event Map</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
  <script src="sketch.js?v=20260916-4" defer></script>
  <style>
    :root{color-scheme:dark}html,body{margin:0;background:#0b0b0b;color:#eee;font-family:system-ui,sans-serif}
    main{max-width:1180px;margin:auto;padding:20px}header{display:flex;align-items:end;justify-content:space-between;gap:18px;flex-wrap:wrap}
    h1{margin:0 0 3px;font-size:22px}.meta{opacity:.62;font-size:12px}
    #layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;margin-top:14px}
    .panel{background:#151515;border:1px solid #292929;border-radius:7px;padding:12px}.label{font-size:10px;opacity:.55;letter-spacing:.08em}
    #tags{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:9px}.tag{display:inline-block;border:1px solid #333;border-radius:999px;padding:4px 8px;cursor:pointer}.tag:hover{border-color:#888}.tag.active{border-color:#fff}
    #metadata{font-size:12px;line-height:1.55;margin-top:8px}.meta-row{margin:6px 0}.meta-key{opacity:.5}.meta-value{word-break:break-word}.source a{color:#fff}
    #canvas{display:block;margin-top:10px}.hint{opacity:.45;font-size:11px;margin-top:5px}
    @media(max-width:800px){#layout{grid-template-columns:1fr}}
  </style>
</head>
<body><main>
  <header><div><h1>event-comvu</h1><div class="meta">Semantic Event Map / clustering · tags · metadata</div></div></header>
  <div id="layout">
    <section class="panel"><div class="label">EVENT CLUSTERS</div><div id="canvas"></div></section>
    <aside class="panel"><div class="label">TAG CLOUD</div><div id="tags"></div><div class="label" style="margin-top:18px">METADATA</div><div id="metadata">Select an event.</div></aside>
  </div>
  <div class="hint">nodes = events · edges = shared semantic features · node size = evidence completeness · click a node or tag</div>
</main></body></html>
