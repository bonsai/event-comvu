<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>event-comvu — Semantic Event Map</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
  <script src="sketch.js" defer></script>
  <style>
    :root{color-scheme:dark}
    html,body{margin:0;background:#0b0b0b;color:#eee;font-family:system-ui,sans-serif}
    main{max-width:1180px;margin:auto;padding:20px}
    header{display:flex;gap:18px;align-items:end;justify-content:space-between;flex-wrap:wrap}
    h1{margin:0 0 3px;font-size:22px}.meta{opacity:.62;font-size:12px}
    .controls{display:flex;gap:10px;align-items:center;font-size:12px}
    select{background:#181818;color:#eee;border:1px solid #444;border-radius:5px;padding:6px 9px}
    #canvas{display:block;margin-top:10px}
    .source{min-height:24px;margin-top:8px;font-size:12px}.source a{color:#fff;text-decoration:underline}
    .hint{opacity:.45;font-size:11px;margin-top:5px}
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>event-comvu</h1><div class="meta">Research instrument / semantic event space</div></div>
    <div class="controls"><label for="mode">X axis</label><select id="mode"><option value="topic">topic</option><option value="community">community</option><option value="format">format</option><option value="place">place</option></select></div>
  </header>
  <div id="canvas"></div>
  <div class="source"><a id="source-link" href="#" target="_blank" rel="noopener">Select an event</a></div>
  <div class="hint">X = selected semantic dimension · Y = time · size = evidence completeness · lines = shared semantic features · click a node</div>
</main>
</body>
</html>
