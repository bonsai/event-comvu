name: Deploy FE

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'data/connpass/**'
      - '.github/workflows/deploy-fe.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build static site
        run: |
          rm -rf dist
          mkdir -p dist/data/connpass
          cp -R web/. dist/
          if [ -s data/connpass/v0n5ai.jsonl ]; then
            cp data/connpass/v0n5ai.jsonl dist/data/connpass/events.jsonl
          else
            cp data/connpass/sample.jsonl dist/data/connpass/events.jsonl
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
