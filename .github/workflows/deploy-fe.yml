name: Deploy FE

on:
  push:
    branches: [master]
    paths-ignore:
      - 'worklog/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Validate canonical 176-event population
        run: |
          test -s data/connpass/vonsai.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/connpass/vonsai.jsonl')
          rows = [json.loads(line) for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]
          expected = 176
          actual = len(rows)
          if actual != expected:
              raise SystemExit(f'POPULATION_GATE_FAILED: expected={expected} actual={actual}')
          print(f'POPULATION_GATE_OK: rows={actual}')
          PY
      - name: Build statistics
        run: go run ./cmd/statistics -in data/connpass/vonsai.jsonl -out analysis/statistics.json
      - name: Build semantic visualization data
        run: |
          rm -rf web/data
          mkdir -p web/data
          go run ./cmd/semantic-normalize -in data/connpass/vonsai.jsonl -out web/data/visualization.json
          go run ./cmd/semantic-analyze -in web/data/visualization.json -out web/data/semantic.json
      - name: Validate visualization data
        run: |
          test -s web/data/visualization.json
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('web/data/visualization.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          events = data.get('events') if isinstance(data, dict) else data
          if not isinstance(events, list) or len(events) != 176:
              raise SystemExit(f'DATA_GATE_FAILED: visualization events={len(events) if isinstance(events, list) else 0}, expected=176')
          print(f'DATA_GATE_OK: events={len(events)}')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build static site
        run: |
          rm -rf dist
          mkdir -p dist
          cp -R web/. dist/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
