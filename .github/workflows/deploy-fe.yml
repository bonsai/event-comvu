name: Deploy FE

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'data/connpass/**'
      - 'cmd/**'
      - 'go.mod'
      - '.github/workflows/deploy-fe.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build semantic visualization data
        run: |
          rm -rf web/data
          if [ -s data/connpass/v0n5ai.jsonl ]; then
            go run ./cmd/semantic-normalize -in data/connpass/v0n5ai.jsonl -out web/data/visualization.json
          else
            mkdir -p web/data
            go run ./cmd/semantic-normalize -in data/connpass/sample.jsonl -out web/data/visualization.json
          fi
          go run ./cmd/semantic-analyze -in web/data/visualization.json -out web/data/semantic.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build static site
        run: |
          rm -rf dist
          mkdir -p dist
          cp -R web/. dist/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
