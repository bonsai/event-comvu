name: Observe Workflow

on:
  workflow_run:
    workflows:
      - Deploy FE
      - Crawl connpass
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: workflow-worklog
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Read workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}" > run.json
          gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs" > jobs.json

          python - <<'PY'
          import json
          from pathlib import Path

          run = json.loads(Path("run.json").read_text())
          jobs = json.loads(Path("jobs.json").read_text()).get("jobs", [])
          failed = []
          lines = [
              "# AW Workflow Recap",
              "",
              f"- workflow: {run.get('name')}",
              f"- run: {run.get('id')}",
              f"- event: {run.get('event')}",
              f"- branch: {run.get('head_branch')}",
              f"- sha: {run.get('head_sha')}",
              f"- status: {run.get('status')}",
              f"- conclusion: {run.get('conclusion')}",
              "",
              "## Jobs",
              "",
          ]
          for job in jobs:
              lines.append(f"- {job.get('name')}: {job.get('conclusion')}")
              for step in job.get('steps') or []:
                  if step.get('conclusion') in {"failure", "cancelled", "timed_out"}:
                      item = f"{job.get('name')} / {step.get('name')} ({step.get('conclusion')})"
                      failed.append(item)
                      lines.append(f"  - FAILED GATE: {item}")
          Path("aw-workflow-recap.md").write_text("\n".join(lines) + "\n")
          Path("failed-gates.txt").write_text("\n".join(failed))
          PY

          cat aw-workflow-recap.md >> "$GITHUB_STEP_SUMMARY"

      - name: Feed failure into AW
        if: ${{ github.event.workflow_run.conclusion != 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          marker="<!-- aw-workflow:${RUN_ID} -->"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "${marker}" --json number --jq 'length')
          if [ "$existing" -eq 0 ]; then
            {
              echo "$marker"
              echo "# AW: workflow failure"
              echo
              echo "workflow: ${WORKFLOW_NAME}"
              echo "run: ${RUN_ID}"
              echo "conclusion: ${CONCLUSION}"
              echo "head_sha: ${HEAD_SHA}"
              echo "run_url: ${RUN_URL}"
              echo
              echo "## Failed gate"
              echo
              cat failed-gates.txt
              echo
              echo "## Next action"
              echo
              echo "Solve the earliest failing stage before changing downstream stages."
            } > issue.md
            gh issue create --repo "$GITHUB_REPOSITORY" --title "aw: ${WORKFLOW_NAME} run ${RUN_ID} failed" --body-file issue.md --label "bug"
          fi

      - name: Record workflow result in worklog
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          run = json.loads(Path("run.json").read_text())
          jobs = json.loads(Path("jobs.json").read_text()).get("jobs", [])
          failed = []
          for job in jobs:
              for step in job.get('steps') or []:
                  if step.get('conclusion') in {'failure', 'cancelled', 'timed_out'}:
                      failed.append(f"{job.get('name')} / {step.get('name')} ({step.get('conclusion')})")

          path = Path('worklog/wf.md')
          path.parent.mkdir(parents=True, exist_ok=True)
          if not path.exists():
              path.write_text('# Workflow Worklog\n\nGitHub Actions execution history observed by AW.\n', encoding='utf-8')

          lines = [
              '',
              f"## {run.get('updated_at', run.get('created_at', 'unknown'))}",
              '',
              f"- {run.get('name')} — {run.get('conclusion')}",
              f"  - run: {run.get('id')}",
              f"  - sha: {run.get('head_sha')}",
              f"  - event: {run.get('event')}",
              f"  - url: {run.get('html_url')}",
          ]
          if failed:
              lines.append('  - failed gates:')
              lines.extend(f'    - {item}' for item in failed)
          else:
              lines.append('  - failed gates: none')
          path.open('a', encoding='utf-8').write_text if False else None
          with path.open('a', encoding='utf-8') as f:
              f.write('\n'.join(lines) + '\n')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worklog/wf.md
          if git diff --cached --quiet; then
            echo 'WORKLOG_UNCHANGED'
            exit 0
          fi
          git commit -m "worklog: record ${WORKFLOW_NAME:-workflow} run ${RUN_ID}"
          git push origin HEAD:master

      - name: Upload AW recap
        uses: actions/upload-artifact@v4
        with:
          name: aw-workflow-recap-${{ github.event.workflow_run.id }}
          path: aw-workflow-recap.md
