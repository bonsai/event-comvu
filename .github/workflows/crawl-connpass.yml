name: Crawl connpass evidence

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect event URLs
        run: python crawler/connpass_profile.py --profile https://connpass.com/user/vonsai/

      - name: Validate event URLs
        run: |
          test -s data/connpass/event_urls.jsonl
          echo "EVENT_URL_GATE_OK: $(wc -l < data/connpass/event_urls.jsonl)"

      - name: Normalize event evidence
        run: python crawler/connpass_event.py --urls data/connpass/event_urls.jsonl --out data/connpass/vonsai.jsonl

      - name: Validate 176-event population
        run: |
          test -s data/connpass/vonsai.jsonl
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/connpass/vonsai.jsonl')
          rows = [json.loads(line) for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]
          expected = 176
          actual = len(rows)
          if actual != expected:
              raise SystemExit(f'POPULATION_GATE_FAILED: expected={expected} actual={actual}')
          assert all(row.get('person_id') == 'connpass:vonsai' for row in rows), 'DATA_GATE_FAILED: identity mismatch'
          assert all(row.get('source_url') for row in rows), 'DATA_GATE_FAILED: source_url missing'
          print(f'POPULATION_GATE_OK: rows={actual}')
          PY

      - name: Commit evidence JSONL
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/connpass/event_urls.jsonl data/connpass/vonsai.jsonl
          git diff --cached --quiet || git commit -m 'data: update connpass evidence'
          git push
