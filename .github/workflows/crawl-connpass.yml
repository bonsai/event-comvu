name: Crawl connpass evidence

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect event URLs
        run: python crawler/connpass_profile.py --profile https://connpass.com/user/v0n5ai/

      - name: Normalize event evidence
        run: python crawler/connpass_event.py

      - name: Commit evidence JSONL
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/connpass/event_urls.jsonl data/connpass/v0n5ai.jsonl
          git diff --cached --quiet || git commit -m 'data: update connpass evidence'
          git push
