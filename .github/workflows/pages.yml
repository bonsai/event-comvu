name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build semantic visualization data
        run: |
          mkdir -p web/data
          if [ -f cmd/semantic-normalize/main.go ]; then
            go run ./cmd/semantic-normalize
          fi

      - name: Validate visualization data
        run: |
          test -f web/data/visualization.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("web/data/visualization.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          events = data.get("events") if isinstance(data, dict) else data
          if not isinstance(events, list) or not events:
              raise SystemExit("DATA_GATE_FAILED: visualization events are empty")
          print(f"DATA_GATE_OK: events={len(events)}")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: |
          test -f web/index.html
          test -f web/sketch.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
