name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build semantic visualization data
        run: |
          mkdir -p web/data
          if [ -f cmd/semantic-normalize/main.go ]; then
            go run ./cmd/semantic-normalize
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: |
          test -f web/index.html
          test -f web/sketch.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
